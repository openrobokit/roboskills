[project]
name = "dexjoco-skill"
version = "0.1.0"
description = "Native DexJoCo runtime for roboskills.eval.dexjoco."
requires-python = "==3.10.*"
dependencies = [
    "opencv-python==4.11.0.86",
    "dexjoco", "robokit>=1.0.0rc1",
    "torch==2.11.0", "torchvision==0.26.0", "warp-lang==1.18.0",
    "imageio[ffmpeg]", "numpy==1.26.4", "scipy", "pyyaml", "trimesh", "shapely",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
dexjoco = { git = "https://github.com/brave-eai/dexjoco.git", rev = "8d23b0fab23b17a58c4b55f3942e17013aaf8267", subdirectory = "dexjoco" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
