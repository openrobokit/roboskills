[project]
name = "libero-skill"
version = "0.1.0"
description = "Native LIBERO / LIBERO-Pro runtime for roboskills.eval.libero."
requires-python = "==3.10.*"
dependencies = [
    "robokit>=1.0.0rc1",
    "torch==2.11.0", "warp-lang==1.18.0",
    # LIBERO-Pro and its robosuite 1.4 fork (vendored by setup.sh), without their training extras
    "numpy==1.26.4", "mujoco==3.3.0", "scipy==1.15.3", "numba==0.61.2", "llvmlite==0.44.0",
    "gym==0.25.2", "bddl==1.0.1", "easydict==1.13", "matplotlib==3.10.1", "termcolor==3.1.0", "future==1.0.0",
    "cloudpickle==3.1.1", "h5py==3.13.0", "PyYAML==6.0.2", "pillow==11.2.1", "opencv-python-headless==4.10.0.84",
    "PyOpenGL==3.1.10", "glfw==2.10.2", "imageio[ffmpeg]", "trimesh", "yourdfpy==0.0.60",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# matched LIBERO profiles require MuJoCo 3.3.0
override-dependencies = ["mujoco==3.3.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
