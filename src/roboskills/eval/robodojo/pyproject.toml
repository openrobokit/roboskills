[project]
name = "robodojo-skill"
version = "0.1.0"
description = "Host side of RoboDojo episodes for roboskills.eval.robodojo (launch.py, robot.py)."
requires-python = "==3.10.*"
dependencies = [
    "opencv-python==5.0.0.93", "mujoco==3.4.0",
    "torch==2.9.1",
    "imageio[ffmpeg]",
    "robokit>=1.0.0rc1",
    "numpy",
    "scipy",
    "pillow",
    "pyyaml",
    "trimesh",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
