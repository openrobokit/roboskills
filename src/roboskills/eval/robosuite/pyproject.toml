[project]
name = "robosuite-skill"
version = "0.1.0"
description = "CaP-X's Robosuite tasks behind the shared Robot contract, for roboskills.eval.robosuite."
requires-python = "==3.10.*"
dependencies = [
    "robosuite", "mujoco==3.5.0", "numba==0.61.2", "opencv-python-headless==4.11.0.86",
    "robokit>=1.0.0rc1",
    "torch==2.11.0", "torchvision==0.26.0", "warp-lang==1.18.0",
    "imageio[ffmpeg]", "numpy==1.26.4", "scipy==1.15.3", "pyyaml", "trimesh", "shapely",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The benchmark physics is CaP-X's MuJoCo 3.5.0.
override-dependencies = ["mujoco==3.5.0"]
# Robosuite's teleoperation devices, test runner, IK controller stack and GUI OpenCV are unused here.
exclude-dependencies = ["pynput", "pytest", "mink", "qpsolvers", "opencv-python"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
# CaP-X's robosuite fork (robosuite 1.5.1 with CaP-X's task changes), the commit its Robo Use runtime pins.
robosuite = { git = "https://github.com/uynitsuj/robosuite.git", rev = "97292732ed909ac3ae116579fb768607034a4dbd" }
warp-lang = { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0+cu12-py3-none-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
