[project]
name = "robotwin-eval"
version = "0.1.0"
description = "Native RoboTwin 2.0 runtime for roboskills.eval.robotwin."
requires-python = "==3.10.*"
dependencies = [
    "mujoco==3.4.0",
    # RoboTwin 2.0 (scripts/requirements.txt), minus policy/annotation extras
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "transforms3d==0.4.2",
    "sapien==3.0.0b1",
    "mplib==0.2.1",
    "toppra",
    "gymnasium==0.29.1",
    "trimesh",
    "open3d==0.18.0",
    "imageio[ffmpeg]",
    "pydantic>=2.5",
    "PyYAML>=6",
    "h5py>=3.8",
    "huggingface_hub",
    "termcolor",
    "setuptools==69.5.1",  # sapien 3.0.0b1 imports pkg_resources
    # RoboTwin's expert check (eval seed selection) uses CuRobo
    "torch==2.9.1",
    "nvidia-curobo==0.7.8+pt2.9.1cu126",
    "warp-lang==1.12.0",  # CuRobo 0.7.8 uses warp.torch, gone in newer warp (RoboTwin pins the same)
    "robokit>=1.0.0rc1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Keep the benchmark on RoboTwin's own pins.
override-dependencies = ["mplib==0.2.1", "sapien==3.0.0b1"]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
nvidia-curobo = { index = "torch-packages-builder" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "torch-packages-builder"
url = "https://jianglongye.github.io/torch_packages_builder"
explicit = true
